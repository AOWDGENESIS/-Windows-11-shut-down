name: Prüfung

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: Skripte und Icon prüfen
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Pillow installieren
        run: python -m pip install --quiet pillow

      - name: Paket prüfen
        run: python tools/validate.py
